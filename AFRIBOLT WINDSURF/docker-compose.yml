version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: afribolt
      POSTGRES_USER: afribolt
      POSTGRES_PASSWORD: afribolt123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - afribolt-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - afribolt-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://afribolt:afribolt123@postgres:5432/afribolt
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-production-jwt-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - afribolt-network
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - afribolt-network

volumes:
  postgres_data:

networks:
  afribolt-network:
    driver: bridge
